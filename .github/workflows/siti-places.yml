name: Siti dei locali da Google Places
# Cerca con Google Places (API New) il sito dei ristoranti senza sito in OSM nei capoluoghi sotto obiettivo,
# poi ne legge i menu. La ricerca gira nella funzione Supabase lume-siti, che riconosce questo repository
# dal token OIDC di GitHub Actions e tiene un tetto di 950 Place Details al mese (gratis): spesa zero.
# Riparte da sola il 1° di ogni mese con i 950 successivi della coda.
on:
  schedule:
    # 09:17 UTC del 1°: dopo la mezzanotte del Pacifico, quando Google azzera la quota gratuita.
    - cron: '17 9 1 * *'
  workflow_dispatch:
    inputs:
      fase:
        description: prova = 1 ricerca e basta; tutto = ricerca fino al tetto del mese, raccolta menu e verifica
        required: true
        default: prova
        type: choice
        options: [prova, tutto]
  workflow_call:
    inputs:
      token: {type: string, required: false, default: ''}
      fase: {type: string, required: false, default: prova}
      verifica_run_id: {type: string, required: false, default: ''}
permissions:
  contents: read
  actions: read
  id-token: write
concurrency:
  group: siti-places
  cancel-in-progress: false
jobs:
  siti:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      FUNZIONE: https://ubalduqlnkubddemkmtz.supabase.co/functions/v1/lume-siti
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Chiave pubblica di Supabase
        run: echo "ANON=$(grep -o 'eyJhbGciOi[A-Za-z0-9._-]*' catalogo.js | head -1)" >> "$GITHUB_ENV"
      - name: Cerca i siti
        env:
          FASE: ${{ inputs.fase || 'tutto' }}
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request, urllib.error
          def oidc():
              # Token OIDC nuovo a ogni chiamata (scade in pochi minuti): la funzione riconosce questo repository.
              req = urllib.request.Request(os.environ['ACTIONS_ID_TOKEN_REQUEST_URL'] + '&audience=lume-siti',
                  headers={'Authorization': 'bearer ' + os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN']})
              t = json.load(urllib.request.urlopen(req, timeout=30))['value']
              print('::add-mask::' + t, flush=True)
              return t
          def chiama(body):
              req = urllib.request.Request(os.environ['FUNZIONE'], json.dumps(body).encode(), {
                  'Content-Type': 'application/json', 'Authorization': 'Bearer ' + os.environ['ANON'], 'apikey': os.environ['ANON'],
                  'x-github-oidc': oidc()})
              return json.load(urllib.request.urlopen(req, timeout=150))
          prova = os.environ['FASE'] == 'prova'
          errori, attesa = 0, 3
          inizio = time.time()
          for giro in range(1 if prova else 2000):
              if time.time() - inizio > 3.5 * 3600: print('Tempo finito: continuo con i siti trovati'); break
              try:
                  r = chiama({'limite': 1 if prova else 30})
              except urllib.error.URLError as e:
                  errori += 1; print('errore', e); time.sleep(10)
                  if errori > 10: break
                  continue
              print(giro, r, flush=True)
              if r.get('tetto_mensile'): print('Tetto di 950 dettagli del mese raggiunto: riparto il 1° del mese'); break
              if r.get('limite_google'): print('Google ha risposto 429: mi fermo senza riprovare'); break
              if r.get('esiti', {}).get('errore', 0) > max(1, r.get('elaborati', 0)) / 2: print('Troppi errori da Google: mi fermo'); break
              if not r.get('altri_in_attesa') or not r.get('elaborati'): break
              time.sleep(attesa)
          s = chiama({'azione': 'stato'}); print(s)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              print('### Ricerca siti con Google Places\n\n|Esito|Locali|\n|---|---:|', file=f)
              for k, v in sorted(s['conteggio'].items()): print(f'|{k}|{v}|', file=f)
              print(f"\nPlace Details usati nel mese {s['mese']}: {s['dettagli_mese']} su {s['tetto_mese']} (gratis)", file=f)
          lista = chiama({'azione': 'lista'})['siti']
          json.dump(lista, open('siti-extra.json', 'w'))
          print(len(lista), 'siti trovati')
          PY
      - name: Legge i menu dai siti trovati
        if: inputs.fase != 'prova'
        run: |
          python3 raccogli_menu.py --mode siti --siti-extra siti-extra.json --solo-extra --workers 12 --output raccolta
          rm siti-extra.json
          python3 verifica_prezzi.py raccolta/esiti.ndjson --campione 10 --output raccolta
          python3 copertura.py raccolta/esiti.ndjson --verificati raccolta/prezzi-verificati.json --output raccolta
          tee -a "$GITHUB_STEP_SUMMARY" < raccolta/copertura.md
      - uses: actions/upload-artifact@v4
        if: inputs.fase != 'prova'
        with:
          name: fonti-places
          path: raccolta/
          retention-days: 14
