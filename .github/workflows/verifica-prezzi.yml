name: Verifica prezzi
# Verifica automatica dei prezzi di una raccolta già fatta, senza rifare la raccolta.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: ID del run di "Raccolta menu Italia" da verificare
        required: true
        default: '45262808608'
      documenti_run_id:
        description: ID del run di "Leggi PDF e foto dei menu" (vuoto se non c'è)
        required: false
        default: ''
      documenti2_run_id:
        description: ID di un secondo run di "Leggi PDF e foto dei menu" (vuoto se non c'è)
        required: false
        default: ''
      places_run_id:
        description: ID del run di "Siti dei locali da Google Places" da aggiungere (vuoto se non c'è)
        required: false
        default: ''
      places_token:
        description: Solo per la ricerca siti con Google Places (avvia quella al posto della verifica)
        required: false
        default: ''
      places_fase:
        description: prova o tutto (solo con places_token)
        required: false
        default: prova
      pubblica_run_id:
        description: Pubblica nell'app i prezzi verificati di questo run di "Verifica prezzi" (apre una PR su menus.json)
        required: false
        default: ''
  push:
    paths: ['.github/workflows/verifica-prezzi.yml', 'verifica_prezzi.py']
permissions:
  contents: read
  actions: read
  id-token: write
jobs:
  pubblica:
    # Porta in menus.json (cioè nell'app) tutti i locali verificati di un run, senza tetto settimanale.
    if: inputs.pubblica_run_id != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: prezzi-verificati
          path: risultati/verificati
          run-id: ${{ inputs.pubblica_run_id }}
          github-token: ${{ github.token }}
      - name: Aggiorna menus.json con i controlli
        id: aggiorna
        run: |
          python3 aggiorna_menus.py risultati --new-limit 20000 --per-citta 20000 --report riassunto-prezzi.md
          cat riassunto-prezzi.md >> "$GITHUB_STEP_SUMMARY"
      - name: Apri la PR
        if: steps.aggiorna.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REVISION: ${{ steps.aggiorna.outputs.revision }}
        run: |
          branch="prezzi/verificati-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add menus.json
          git commit -q -m "Pubblica i prezzi verificati (revisione $REVISION)"
          git push -q origin "$branch"
          url=$(gh pr create --base main --head "$branch" --title "Prezzi verificati nell'app (revisione $REVISION)" --body-file riassunto-prezzi.md)
          echo "PR aperta: $url" >> "$GITHUB_STEP_SUMMARY"
  places:
    if: inputs.places_token != ''
    uses: ./.github/workflows/siti-places.yml
    with:
      token: ${{ inputs.places_token }}
      fase: ${{ inputs.places_fase }}
      verifica_run_id: ''
  verifica:
    if: inputs.places_token == '' && inputs.pubblica_run_id == ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: raccolta-menu-italia
          path: raccolta
          run-id: ${{ inputs.run_id || '45262808608' }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        if: inputs.documenti_run_id != ''
        with:
          pattern: documenti-*
          path: documenti
          run-id: ${{ inputs.documenti_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        if: inputs.documenti2_run_id != ''
        with:
          pattern: documenti-*
          path: documenti2
          run-id: ${{ inputs.documenti2_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        if: inputs.places_run_id != ''
        with:
          name: fonti-places
          path: places
          run-id: ${{ inputs.places_run_id }}
          github-token: ${{ github.token }}
      - name: Verifica e misura la copertura
        run: |
          shopt -s nullglob
          [ -f places/esiti.ndjson ] && cat places/esiti.ndjson >> raccolta/esiti.ndjson
          python3 verifica_prezzi.py raccolta/esiti.ndjson --documenti documenti/*/documenti.ndjson documenti2/*/documenti.ndjson --output verifica
          python3 copertura.py raccolta/esiti.ndjson --verificati verifica/prezzi-verificati.json --output verifica
          tee -a "$GITHUB_STEP_SUMMARY" < verifica/copertura.md
          python3 strumenti/diagnosi_citta.py raccolta/esiti.ndjson verifica --province MI,RM
      - uses: actions/upload-artifact@v4
        with:
          name: prezzi-verificati
          path: verifica/
          retention-days: 14
