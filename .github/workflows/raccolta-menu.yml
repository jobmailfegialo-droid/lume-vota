name: Raccolta menu Italia
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Fonti da controllare
        required: true
        default: diretti
        type: choice
        options: [diretti, siti, tutti]
  workflow_call:
    inputs:
      mode:
        description: Fonti da controllare (diretti, siti, tutti)
        required: false
        default: diretti
        type: string
  push:
    paths: ['.github/workflows/raccolta-menu.yml']
permissions:
  contents: read
concurrency:
  # Chiamata da un altro workflow: gruppo legato al run, così non blocca il chiamante.
  group: ${{ github.workflow == 'Raccolta menu Italia' && format('raccolta-menu-{0}-{1}', inputs.mode || 'diretti', github.ref_name) || format('raccolta-menu-annidata-{0}', github.run_id) }}
  cancel-in-progress: false
jobs:
  raccolta:
    name: ${{ matrix.regione }}
    runs-on: ubuntu-latest
    timeout-minutes: 170
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        include:
          - {regione: "Lombardia", slug: lombardia}
          - {regione: "Veneto", slug: veneto}
          - {regione: "Lazio", slug: lazio}
          - {regione: "Emilia-Romagna", slug: emilia-romagna}
          - {regione: "Trentino-Alto Adige", slug: trentino-alto-adige}
          - {regione: "Piemonte", slug: piemonte}
          - {regione: "Toscana", slug: toscana}
          - {regione: "Campania", slug: campania}
          - {regione: "Sicilia", slug: sicilia}
          - {regione: "Friuli-Venezia Giulia", slug: friuli-venezia-giulia}
          - {regione: "Puglia", slug: puglia}
          - {regione: "Marche", slug: marche}
          - {regione: "Liguria", slug: liguria}
          - {regione: "Sardegna", slug: sardegna}
          - {regione: "Abruzzo", slug: abruzzo}
          - {regione: "Umbria", slug: umbria}
          - {regione: "Calabria", slug: calabria}
          - {regione: "Valle d'Aosta", slug: valle-d-aosta}
          - {regione: "Basilicata", slug: basilicata}
          - {regione: "Molise", slug: molise}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Controlla le fonti pubbliche della regione
        env:
          MODE: ${{ inputs.mode || 'diretti' }}
          REGIONE: ${{ matrix.regione }}
        run: python3 raccogli_menu.py --mode "$MODE" --regione "$REGIONE" --workers 12 --output raccolta
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fonti-${{ matrix.slug }}
          path: raccolta/
          retention-days: 5
  totale:
    if: always()
    needs: raccolta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: fonti-*
          path: risultati
      - name: Somma esiti e prepara elenco unico
        run: |
          python3 - <<'PY'
          from collections import Counter
          import json, os, pathlib
          root=pathlib.Path('risultati')
          totals=Counter()
          parts=list(root.glob('*/totali.json'))
          for f in parts: totals.update(json.loads(f.read_text()))
          out=pathlib.Path('catalogo-raccolto')
          out.mkdir()
          (out/'totali.json').write_text(json.dumps({'partizioni':len(parts),**totals},indent=2))
          with (out/'esiti.ndjson').open('wb') as w:
              for f in sorted(root.glob('*/esiti.ndjson')): w.write(f.read_bytes())
          for lic in root.glob('*/LICENSE-OSM.md'):
              (out/lic.name).write_bytes(lic.read_bytes()); break
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as s:
              print('### Risultati nazionali\n\nRegioni completate:',len(parts),'di 20\n\n|Esito|Numero|\n|---|---:|',file=s)
              for k,v in totals.items(): print(f'|{k}|{v}|',file=s)
          print(dict(totals))
          PY
      - name: Verifica i prezzi e misura la copertura dei capoluoghi
        run: |
          python3 verifica_prezzi.py catalogo-raccolto/esiti.ndjson --campione 0 --output catalogo-raccolto
          python3 copertura.py catalogo-raccolto/esiti.ndjson --verificati catalogo-raccolto/prezzi-verificati.json --output catalogo-raccolto
          tee -a "$GITHUB_STEP_SUMMARY" < catalogo-raccolto/copertura.md
      - uses: actions/upload-artifact@v4
        with:
          name: raccolta-menu-italia
          path: catalogo-raccolto/
          retention-days: 7
